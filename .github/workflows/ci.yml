name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: actions/cache@v4
        with:
          path: tools/.cache/voice
          key: voice-${{ runner.os }}-${{ hashFiles('tools/voice_assets.json') }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare pinned voice assets
        run: python tools/prepare_voice.py

      - name: Build, test, and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
